[project]
name = "affiliate-threads-hermes-plugin"
version = "1.0.0"
description = "Hermes Agent plugin: AI-assisted affiliate content engine for Meta Threads"
readme = "README.md"
# Hermes itself requires 3.11+, but the plugin's modules are also imported by the
# skill's scripts, which run under whatever `python3` the host provides — on macOS
# that is often 3.9. The code is deliberately written to import cleanly there.
requires-python = ">=3.9"
license = { text = "MIT" }

# Runtime dependencies are intentionally empty.
#
# The plugin reuses what Hermes already provides:
#   - Google Sheets access  -> bundled `google-workspace` skill (google_api.py)
#   - research + web        -> bundled web/browser tools
#   - image generation      -> Hermes built-in image tool (FAL.ai)
#   - scheduling            -> Hermes cron
#   - memory / novelty      -> Hermes persistent memory
#
# The only network call the plugin makes itself is to graph.threads.net, using
# the standard library so it can never be blocked by a dependency conflict.
#
# Hermes reads this list when the plugin is installed — a pyproject.toml beside
# plugin.yaml is the preferred form of the manifest's python_dependencies — so an
# empty list here means "install nothing into the Hermes venv".
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The plugin's __init__.py sits at the repository root — that is what makes the
# repo installable with `hermes plugins install owner/repo` — and the root
# directory name is not a valid Python identifier. Without the cutoff, pytest
# builds its collector chain from the rootdir, finds that __init__.py, and tries
# to import the repo root as a package. Keeping the conftest cutoff inside
# tests/ stops the chain at the test directory. Run pytest from the repo root.
addopts = "-q --confcutdir=tests"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "E501",  # long lines in docstrings/prompts are fine
]

[tool.ruff.lint.isort]
known-first-party = ["atg_plugin", "conftest"]

[tool.ruff.lint.per-file-ignores]
"skills/**/scripts/*.py" = ["E402"]
